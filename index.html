<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dilema Uang Koin</title>
    <style>
        :root {
            --bg-dark: #090d16;
            --card-bg: #131b2e;
            --border-color: #243049;
            --gold: #f59e0b;
            --gold-hover: #d97706;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at top, #1e1b4b 0%, var(--bg-dark) 60%);
            color: var(--text-primary);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100dvh;
            padding: 20px;
            overflow: hidden;
        }

        body.rgb-mode {
            background-image: none;
            animation: rgbBg 0.5s linear infinite;
        }

        body.rgb-mode .kartu {
            animation: rgbBorder 0.5s linear infinite, shake 0.25s ease-in-out infinite;
            background-color: rgba(15, 23, 42, 0.94);
        }

        .kartu {
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 20px;
            padding: 36px 26px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7);
            position: relative;
            z-index: 10;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background-color: rgba(245, 158, 11, 0.14);
            color: var(--gold);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            padding: 6px 14px;
            border-radius: 999px;
            margin-bottom: 18px;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        .dot {
            width: 7px;
            height: 7px;
            background-color: var(--gold);
            border-radius: 50%;
            animation: pulse 1s infinite;
        }

        h1 {
            color: var(--text-primary);
            font-size: 22px;
            font-weight: 800;
            line-height: 1.4;
            margin-bottom: 12px;
        }

        p {
            color: var(--text-secondary);
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 26px;
        }

        a.btn-money {
            display: block;
            text-decoration: none;
            background-color: var(--gold);
            color: #090d16;
            padding: 15px 20px;
            font-size: 16px;
            font-weight: 800;
            border-radius: 12px;
            width: 100%;
            box-shadow: 0 4px 14px rgba(245, 158, 11, 0.35);
            transition: transform 0.1s ease, background-color 0.2s ease;
        }

        a.btn-money:hover {
            background-color: var(--gold-hover);
        }

        a.btn-money:active {
            transform: scale(0.97);
        }

        @keyframes rgbBg {
            0%   { background-color: #ff0055; }
            20%  { background-color: #ff9900; }
            40%  { background-color: #33ff00; }
            60%  { background-color: #00ffff; }
            80%  { background-color: #7700ff; }
            100% { background-color: #ff0055; }
        }

        @keyframes rgbBorder {
            0%   { border-color: #00ffff; box-shadow: 0 0 35px #00ffff; }
            33%  { border-color: #ff0055; box-shadow: 0 0 35px #ff0055; }
            66%  { border-color: #33ff00; box-shadow: 0 0 35px #33ff00; }
            100% { border-color: #00ffff; box-shadow: 0 0 35px #00ffff; }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.3); }
        }

        @keyframes shake {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(-4px, 3px) rotate(-1deg); }
            50% { transform: translate(4px, -3px) rotate(1deg); }
            75% { transform: translate(-3px, -3px) rotate(-1deg); }
        }
    </style>
</head>
<body>

    <main id="card" class="kartu">
        <div class="badge">
            <span class="dot"></span>
            <span id="statusText">Uji Moralitas</span>
        </div>
        <h1 id="titleText">Jika kamu menemukan uang koin di jalan, apakah kamu akan mengambilnya?</h1>
        <p id="descText">Tidak ada pilihan lain selain mengikuti insting sejati.</p>
        
        <a id="btnMoney" href="https://www.youtube.com/watch?v=k2ZEsfteJ5g" class="btn-money">Uang tetaplah uang</a>
    </main>

    <script>
        const btnMoney = document.getElementById('btnMoney');
        const statusText = document.getElementById('statusText');
        const titleText = document.getElementById('titleText');
        const descText = document.getElementById('descText');

        btnMoney.addEventListener('click', () => {
            document.body.classList.add('rgb-mode');
            statusText.textContent = 'PRINSIP EKONOMI';
            titleText.textContent = 'MANTAP, JIWA PENGUSAHA!';
            descText.innerHTML = 'Seratus perak pun kalau dikumpulin jadi bukit. <strong>Uang tetaplah uang!</strong>';
        });
    </script>

</body>
</html>
